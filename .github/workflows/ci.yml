name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets --all-features

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: starstack:ci
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image
      - name: Start the packaged web server
        run: |
          docker run --rm starstack:ci --help
          docker run --detach --name starstack-ci --publish 127.0.0.1:18080:8080 \
            --env STARSTACK_ADMIN_USER=ci --env STARSTACK_ADMIN_PASSWORD=temporary-ci-password \
            --env STARSTACK_SYNC_INTERVAL_MINUTES=0 starstack:ci
          trap 'docker logs starstack-ci; docker rm --force --volumes starstack-ci' EXIT
          curl --fail --silent --show-error --location --retry-all-errors --retry 10 --retry-delay 1 \
            http://127.0.0.1:18080/login --output "$RUNNER_TEMP/starstack-login.html"
          grep -q 'id="root"' "$RUNNER_TEMP/starstack-login.html"
          docker exec starstack-ci test -w /data

[package]
name = "starstack"
version = "0.2.4"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
description = "A local-first semantic library for your GitHub stars"
repository = "https://github.com/ca-x/starstack"

[features]
default = ["firecrawl-local"]
firecrawl-local = ["dep:firecrawl-local", "dep:kuchikiki", "dep:futures"]

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
firecrawl-local = { version = "0.1.1", optional = true }
kuchikiki = { version = "0.8.9-speedreader", optional = true }
futures = { version = "0.3", optional = true }
aimux-core = "0.7.0"
aimux-providers = { version = "0.7.0", default-features = false }
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
hawdb-vector-projection = "0.40.0"
include_dir = "0.7"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks", "stream", "gzip"] }
rmcp = { version = "3.11", features = ["transport-io", "elicitation", "transport-streamable-http-server"] }
diesel = { version = "2.3", features = ["sqlite"] }
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
backoff = "0.4.0"

[profile.release]
strip = true

services:
  starstack:
    image: ghcr.io/ca-x/starstack:${STARSTACK_TAG:-latest}
    build:
      context: .
      args:
        STARSTACK_FEATURES: "${STARSTACK_FEATURES:-}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      STARSTACK_HOME: /data
      STARSTACK_ADMIN_USER:
      STARSTACK_ADMIN_PASSWORD:
      STARSTACK_SECURE_COOKIE:
      STARSTACK_MCP_HOSTS:
      STARSTACK_GITHUB_CLIENT_ID: "${STARSTACK_GITHUB_CLIENT_ID:-}"
      STARSTACK_GITHUB_SCOPE: "${STARSTACK_GITHUB_SCOPE:-}"
      STARSTACK_PROXY_URL:
      STARSTACK_HF_ENDPOINT:
      STARSTACK_MODELSCOPE_ENDPOINT:
      STARSTACK_README_INTERVAL_MINUTES: "${STARSTACK_README_INTERVAL_MINUTES:-30}"
      STARSTACK_SYNC_INTERVAL_MINUTES: "${STARSTACK_SYNC_INTERVAL_MINUTES:-360}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-${GH_TOKEN:-}}"
      STARSTACK_AI_PROVIDER:
      STARSTACK_AI_MODEL: "${STARSTACK_AI_MODEL:-}"
      STARSTACK_AI_BASE_URL: "${STARSTACK_AI_BASE_URL:-}"
      STARSTACK_AI_API_KEY: "${STARSTACK_AI_API_KEY:-}"
      STARSTACK_MODEL:
      STARSTACK_OLLAMA_URL:
      STARSTACK_OLLAMA_DEFAULT_URL: "${STARSTACK_OLLAMA_DEFAULT_URL:-http://host.docker.internal:11434}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - starstack-data:/data

volumes:
  starstack-data:
